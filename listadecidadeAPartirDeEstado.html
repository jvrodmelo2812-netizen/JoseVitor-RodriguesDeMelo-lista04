<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>listaCidadesAPartirDeEstados</title>
  <style>
    body {
      font-family: 'Times New Roman', Times, serif;
      padding: 20px;
      color: #000;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      margin-top: 12px;
      font-size: 16px;
    }
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      background-color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    #resultado {
      margin-top: 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>listaCidadesAPartirDeEstados</h1>

  <label for="estado">Estado:</label>
  <select id="estado">
    <option value="">Selecione um estado</option>
  </select>

  <label for="cidade">Cidade:</label>
  <select id="cidade" disabled>
    <option value="">Selecione uma cidade</option>
  </select>

  <div id="resultado"></div>

  <script>
    const selectEstado = document.getElementById('estado');
    const selectCidade = document.getElementById('cidade');
    const resultadoDiv = document.getElementById('resultado');

    async function carregarEstados() {
      try {
        const response = await fetch('https://ibge.gov.br');
        const estados = await response.json();

        estados.forEach(estado => {
          const option = document.createElement('option');
          option.value = estado.sigla;
          option.textContent = estado.nome;
          selectEstado.appendChild(option);
        });
      } catch (error) {
        console.error('Erro ao carregar estados:', error);
      }
    }

    selectEstado.addEventListener('change', async function () {
      const uf = this.value;
      selectCidade.innerHTML = '<option value="">Selecione uma cidade</option>';
      resultadoDiv.textContent = '';

      if (!uf) {
        selectCidade.disabled = true;
        return;
      }

      selectCidade.disabled = false;

      try {
        const response = await fetch(`https://ibge.gov.br{uf}/municipios?orderBy=nome`);
        const cidades = await response.json();

        cidades.forEach(cidade => {
          const option = document.createElement('option');
          option.value = cidade.nome;
          option.textContent = cidade.nome;
          selectCidade.appendChild(option);
        });
      } catch (error) {
        console.error('Erro ao carregar cidades:', error);
      }
    });

    selectCidade.addEventListener('change', function () {
      const cidadeNome = this.value;
      const estadoNome = selectEstado.options[selectEstado.selectedIndex].text;

      if (cidadeNome && selectEstado.value) {
        resultadoDiv.textContent = `Você selecionou: ${cidadeNome} - ${estadoNome}`;
      } else {
        resultadoDiv.textContent = '';
      }
    });

    carregarEstados();
  </script>

</body>
</html>
