<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>detalhaPostagem</title>
  <style>
    body {
      font-family: 'Times New Roman', Times, serif;
      padding: 20px;
      color: #000;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 16px;
    }
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      background-color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      padding: 8px 4px;
      border-bottom: 1px solid #ddd;
      cursor: pointer;
      font-size: 16px;
    }
    li:hover {
      background-color: #f5f5f5;
    }
    #detalhes {
      margin-top: 24px;
    }
    #detalhes h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }
    #detalhes p {
      font-size: 16px;
      line-height: 1.5;
    }
    .comentario {
      margin-bottom: 12px;
      font-size: 15px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h1>detalhaPostagem</h1>

  <label for="usuario">Usuário:</label>
  <select id="usuario">
    <option value="">Selecione um usuário</option>
  </select>

  <ul id="lista-posts"></ul>

  <div id="detalhes"></div>

  <script>
    const selectUsuario = document.getElementById('usuario');
    const listaPosts = document.getElementById('lista-posts');
    const detalhesDiv = document.getElementById('detalhes');

    async function carregarUsuarios() {
      try {
        const response = await fetch('https://typicode.com');
        const usuarios = await response.json();

        usuarios.forEach(usuario => {
          const option = document.createElement('option');
          option.value = usuario.id;
          option.textContent = usuario.name;
          selectUsuario.appendChild(option);
        });
      } catch (error) {
        console.error('Erro ao carregar usuários:', error);
      }
    }

    selectUsuario.addEventListener('change', async function () {
      const userId = this.value;
      listaPosts.innerHTML = '';
      detalhesDiv.innerHTML = '';

      if (!userId) return;

      try {
        const response = await fetch(`https://typicode.com{userId}`);
        const posts = await response.json();

        posts.forEach(post => {
          const li = document.createElement('li');
          li.textContent = post.title;
          li.addEventListener('click', () => carregarDetalhesPost(post.id));
          listaPosts.appendChild(li);
        });
      } catch (error) {
        console.error('Erro ao carregar postagens:', error);
      }
    });

    async function carregarDetalhesPost(postId) {
      detalhesDiv.innerHTML = 'Carregando...';

      try {
        const [postResponse, comentariosResponse] = await Promise.all([
          fetch(`https://typicode.com{postId}`),
          fetch(`https://typicode.com{postId}/comments`)
        ]);

        const post = await postResponse.json();
        const comentarios = await comentariosResponse.json();

        let comentariosHTML = '<h3>Comentários:</h3>';
        comentarios.forEach(comentario => {
          comentariosHTML += `
            <div class="comentario">
              <strong>${comentario.email}:</strong> ${comentario.body}
            </div>
          `;
        });

        detalhesDiv.innerHTML = `
          <h2>${post.title}</h2>
          <p>${post.body}</p>
          ${comentariosHTML}
        `;
      } catch (error) {
        detalhesDiv.innerHTML = '<p>Erro ao carregar detalhes da postagem.</p>';
        console.error('Erro:', error);
      }
    }

    carregarUsuarios();
  </script>

</body>
</html>
